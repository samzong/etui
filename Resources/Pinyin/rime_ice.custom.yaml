patch:
  schema/dependencies: []
  translator/dictionary: pinyin
  translator/user_dict: rime_ice
  switches/@1/reset: 1
  speller/alphabet: zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA
  recognizer/patterns:
    email: "^[A-Za-z][-_.0-9A-Za-z]*@.*$"
    underscore: "^[A-Za-z]+_.*"
    url: "^(www[.]|https?:|ftp[.:]|mailto:|file:).*$|^[a-z]+[.].+$"
  editor/bindings:
    BackSpace: revert
    Control+BackSpace: noop
    Control+Return: noop
    Control+Shift+Return: noop
    Control+Delete: delete_candidate
    Delete: delete
    Escape: cancel
    Return: commit_raw_input
    space: confirm
  engine/processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  engine/segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  engine/translators:
    - punct_translator
    - script_translator
    - table_translator@custom_phrase
    - lua_translator@*force_gc
  engine/filters:
    - lua_filter@*corrector
    - lua_filter@*pin_cand_filter
    - lua_filter@*long_word_filter
    - simplifier@emoji
    - uniquifier
